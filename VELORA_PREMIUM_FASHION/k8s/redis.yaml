apiVersion: apps/v1
kind: Deployment
metadata:
  name: velora-redis
  namespace: velora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velora-redis
  template:
    metadata:
      labels:
        app: velora-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: velora-redis
  namespace: velora
spec:
  type: ClusterIP
  selector:
    app: velora-redis
  ports:
    - port: 6379
      targetPort: 6379
