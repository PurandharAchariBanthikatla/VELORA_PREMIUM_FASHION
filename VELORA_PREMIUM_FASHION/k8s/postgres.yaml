apiVersion: apps/v1
kind: Deployment
metadata:
  name: velora-postgres
  namespace: velora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velora-postgres
  template:
    metadata:
      labels:
        app: velora-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: velora-postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: velora-postgres
  namespace: velora
spec:
  type: ClusterIP
  selector:
    app: velora-postgres
  ports:
    - port: 5432
      targetPort: 5432
