<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - VELORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="toast" aria-live="polite"></div>
    <div class="dash-login-shell">
      <div class="dash-login-box">
        <div class="dash-logo">VELORA</div>
        <p class="dash-subtitle" style="color:var(--grey)">Reset Your Password</p>
        <form id="resetForm">
          <label class="form-group">Email Address
            <input type="email" id="email" required />
          </label>
          <label class="form-group">Reset Code
            <input type="text" id="token" placeholder="Paste the code from your email" required />
          </label>
          <label class="form-group">New Password
            <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required />
          </label>
          <button class="btn-primary" type="submit">Reset Password</button>
          <p class="login-error" id="resetError"></p>
          <p class="login-success" id="resetSuccess"></p>
        </form>
        <a class="back-to-store" href="index.html" style="display:block;margin-top:1rem">← Back to Store</a>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const { api } = window.Velora;
      const params = new URLSearchParams(window.location.search);
      if (params.get("email")) document.getElementById("email").value = params.get("email");
      if (params.get("token")) document.getElementById("token").value = params.get("token");

      document.getElementById("resetForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById("resetError");
        const successEl = document.getElementById("resetSuccess");
        errorEl.style.display = "none";
        successEl.style.display = "none";
        try {
          const data = await api("/api/auth/reset-password", {
            method: "POST",
            skipAuth: true,
            body: {
              email: document.getElementById("email").value.trim(),
              token: document.getElementById("token").value.trim(),
              newPassword: document.getElementById("newPassword").value
            }
          });
          successEl.textContent = `${data.message} Redirecting to sign in...`;
          successEl.style.display = "block";
          document.getElementById("resetForm").reset();
          window.setTimeout(() => { window.location.href = "index.html"; }, 2500);
        } catch (error) {
          errorEl.textContent = error.message;
          errorEl.style.display = "block";
        }
      });
    </script>
  </body>
</html>
