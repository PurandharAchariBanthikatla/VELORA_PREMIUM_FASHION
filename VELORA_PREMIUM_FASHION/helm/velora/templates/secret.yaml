{{/*
Secrets are never baked into this chart's committed values files.
secrets.create defaults to false — either:
  1. set secrets.existingSecret to a Secret you manage out-of-band
     (sealed-secrets, external-secrets, SOPS, cloud secret manager sync), or
  2. set secrets.create=true and pass secrets.values.* via `--set` from a
     CI secret store or `--set-file` — never commit real values to a
     values-*.yaml file that lands in Git.
*/}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velora.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velora.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
